name: Auto-assign reviewers by page owners
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  changed-pages:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
      files: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            docs/*.md
            docs/**/*.md
            docs/**/*.rst

  validate-owners:
    needs: changed-pages
    if: needs.changed-pages.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every changed page declares owners
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.changed-pages.outputs.files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const files = process.env.CHANGED_FILES.split(' ').filter(Boolean);
            // matches a login (e.g. "achew") or "team:slug" (e.g. "team:ckt-oem")
            const validEntry = /^(team:)?[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i;

            function extractMd(content) {
              const m = content.match(/```\{owners\}\s*(.+?)\s*```/s);
              return m ? m[1].split(',').map(s => s.trim()) : null;
            }
            function extractRst(content) {
              const m = content.match(/^\.\.\s+owners::\s*(.+)$/m);
              return m ? m[1].split(',').map(s => s.trim()) : null;
            }

            const errors = [];

            for (const file of files) {
              if (!fs.existsSync(file)) continue; // deleted file
              const ext = path.extname(file).toLowerCase();
              if (ext !== '.md' && ext !== '.markdown' && ext !== '.rst') continue;

              const content = fs.readFileSync(file, 'utf8');
              const owners = ext === '.rst' ? extractRst(content) : extractMd(content);

              if (owners === null) {
                errors.push(`${file}: missing owners directive`);
                continue;
              }
              for (const entry of owners) {
                if (!entry || !validEntry.test(entry)) {
                  errors.push(`${file}: invalid owner entry "${entry}"`);
                }
              }
            }

            if (errors.length > 0) {
              for (const e of errors) console.log(`::error::${e}`);
              core.setFailed(`${errors.length} page(s) have missing/invalid owners.`);
            } else {
              console.log('All changed pages have valid owners.');
            }

  assign-reviewers:
    needs: [changed-pages, validate-owners]
    if: needs.changed-pages.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract owners and request review
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.changed-pages.outputs.files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const TEAM_ORG = 'canonical'; // all team: entries belong to this org

            const files = process.env.CHANGED_FILES.split(' ').filter(Boolean);
            const users = new Set();
            const teams = new Set();

            function addOwner(entry) {
              const key = entry.trim();
              if (!key) return;
              if (key.toLowerCase().startsWith('team:')) {
                teams.add(key.slice(5).trim());
              } else {
                users.add(key.replace(/^@/, ''));
              }
            }

            function extractMd(content) {
              const m = content.match(/```\{owners\}\s*(.+?)\s*```/s);
              return m ? m[1].split(',').map(s => s.trim()) : [];
            }
            function extractRst(content) {
              const m = content.match(/^\.\.\s+owners::\s*(.+)$/m);
              return m ? m[1].split(',').map(s => s.trim()) : [];
            }

            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const ext = path.extname(file).toLowerCase();
              let owners = [];
              if (ext === '.md' || ext === '.markdown') owners = extractMd(fs.readFileSync(file, 'utf8'));
              else if (ext === '.rst') owners = extractRst(fs.readFileSync(file, 'utf8'));
              owners.forEach(addOwner);
            }

            const author = context.payload.pull_request.user.login;
            users.delete(author);

            console.log('Org (teams):', TEAM_ORG);
            console.log('Users:', [...users], 'Teams:', [...teams]);
            if (users.size === 0 && teams.size === 0) {
              console.log('No owners found, skipping.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: [...users],
                team_reviewers: [...teams],
              });
            } catch (err) {
              console.log('requestReviewers failed:', err.message);
            }
